<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Javascript</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 id="heading">Learning Javascript</h1>
    <button id="clickBtn">click</button>
    <button onclick="console.log(this)">Click Me</button>

    <input
      type="text"
      name="username"
      id="username"
      onkeyup="debounceFnWithLeadAndTrail()"
    />

    <!-- <script defer src="/promises/custompromise.js"></script> -->
    <script>
      function Test() {
        console.log("Test");
      }

      Test.prototype.sayTest = function () {
        console.log("sayTest");
      };

      const test = new Test();

      console.dir(test.__proto__);
    </script>
  </body>
</html>
